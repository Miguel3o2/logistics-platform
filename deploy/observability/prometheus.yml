################################################################################
# deploy/observability/prometheus.yml
################################################################################
global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    platform: logistics

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: kafka-jmx
    static_configs:
      - targets: [kafka-1:9308, kafka-2:9308, kafka-3:9308]

  - job_name: spark
    static_configs:
      - targets: [spark-master:8081]
    metrics_path: /metrics

  - job_name: fastapi-ml
    static_configs:
      - targets: [ml-server:8000]
    metrics_path: /metrics

  - job_name: airflow
    static_configs:
      - targets: [airflow-webserver:8080]
    metrics_path: /admin/metrics

  - job_name: debezium
    static_configs:
      - targets: [debezium:8083]
    metrics_path: /metrics

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
