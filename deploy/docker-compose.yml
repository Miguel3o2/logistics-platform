################################################################################
# deploy/docker-compose.yml
# Global Logistics & Predictive Analytics Platform
#
# Services (12 total):
#   kafka-1,2,3     — 3-broker KRaft Kafka cluster (no Zookeeper)
#   kafka-ui        — Topic/offset inspection UI
#   postgres-op     — Operational DB (source of Debezium CDC)
#   debezium        — CDC connector: Postgres → Kafka
#   minio           — S3-compatible Delta Lake storage
#   minio-init      — Creates required buckets on first boot
#   spark-master    — Spark master node
#   spark-worker-1  — Spark worker (2 cores, 3 GB)
#   spark-worker-2  — Spark worker (2 cores, 3 GB)
#   airflow-postgres— Airflow metadata DB
#   airflow-init    — One-shot DB migration + admin user
#   airflow-sched   — Airflow scheduler
#   airflow-web     — Airflow webserver
#   mlflow          — Experiment tracking + model registry
#   ml-server       — FastAPI ETA + failure prediction server
#   prometheus      — Metrics collection
#   grafana         — Dashboards
#
# Ports:
#   9092,9093,9094  Kafka brokers
#   8080            Kafka UI
#   5432            Postgres (operational)
#   8083            Debezium Connect REST
#   9000            Minio S3 API
#   9001            Minio console
#   7077            Spark master RPC
#   8081            Spark master UI
#   8082,8086       Spark worker UIs
#   8888            Airflow
#   5000            MLflow
#   8000            FastAPI ML server
#   9090            Prometheus
#   3000            Grafana
#
# Usage:
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml down -v
################################################################################

x-kafka-common: &kafka-common
  image: apache/kafka:3.8.1
  restart: unless-stopped
  networks:
    - logistics-net

x-spark-common: &spark-common
  build:
    context: ./spark
  restart: unless-stopped
  networks:
    - logistics-net
  working_dir: /opt/logistics
  environment:
    HOME: /tmp/spark
    IVY_HOME: /tmp/.ivy2
    PYSPARK_PYTHON: python3
    PYTHONPATH: /opt/logistics
    SPARK_RPC_AUTHENTICATION_ENABLED: "no"
    SPARK_RPC_ENCRYPTION_ENABLED: "no"
    SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
    SPARK_SSL_ENABLED: "no"
    AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-logistics}
    AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-logistics123}
  volumes:
    - ../src:/opt/logistics/src
    - spark-data:/data/delta

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  restart: on-failure:5
  networks:
    - logistics-net
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-logistics-dev-secret}
    AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
    KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9093,kafka-3:9094
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-logistics}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-logistics123}
    DELTA_GOLD_PATH: s3a://logistics/delta/gold
  volumes:
    - ../dag:/opt/airflow/dags
    - ../src:/opt/logistics/src
    - airflow-logs:/opt/airflow/logs

services:

  kafka-1:
    <<: *kafka-common
    container_name: logistics-kafka-1
    hostname: kafka-1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:19092,2@kafka-2:19093,3@kafka-3:19094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_COMPRESSION_TYPE: gzip
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CLUSTER_ID: LogisticsKRaftCluster01
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:29092"
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  kafka-2:
    <<: *kafka-common
    container_name: logistics-kafka-2
    hostname: kafka-2
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:29093,CONTROLLER://0.0.0.0:19093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9093,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:19092,2@kafka-2:19093,3@kafka-3:19094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_COMPRESSION_TYPE: gzip
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CLUSTER_ID: LogisticsKRaftCluster01
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9093:29093"
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9093"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  kafka-3:
    <<: *kafka-common
    container_name: logistics-kafka-3
    hostname: kafka-3
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9094,EXTERNAL://0.0.0.0:29094,CONTROLLER://0.0.0.0:19094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9094,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:19092,2@kafka-2:19093,3@kafka-3:19094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_COMPRESSION_TYPE: gzip
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CLUSTER_ID: LogisticsKRaftCluster01
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9094:29094"
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9094"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: logistics-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: logistics-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9093,kafka-3:9094
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    networks:
      - logistics-net
    restart: unless-stopped

  # ── Operational PostgreSQL (source of Debezium CDC) ───────────────────────
  postgres-operational:
    image: postgres:16-alpine
    container_name: logistics-postgres-op
    hostname: postgres-operational
    environment:
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics123
      POSTGRES_DB: logistics_ops
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    ports:
      - "55432:5432"
    volumes:
      - postgres-op-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    networks:
      - logistics-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics -d logistics_ops"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Debezium Connect (CDC: Postgres → Kafka) ──────────────────────────────
  debezium:
    image: quay.io/debezium/connect:2.7
    container_name: logistics-debezium
    hostname: debezium
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9093,kafka-3:9094
      GROUP_ID: logistics-debezium-group
      CONFIG_STORAGE_TOPIC: debezium.configs
      OFFSET_STORAGE_TOPIC: debezium.offsets
      STATUS_STORAGE_TOPIC: debezium.status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    depends_on:
      kafka-1:
        condition: service_healthy
      postgres-operational:
        condition: service_healthy
    networks:
      - logistics-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 60s
    restart: unless-stopped

  # ── Minio (local S3 for Delta Lake) ───────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: logistics-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-logistics}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-logistics123}
    volumes:
      - minio-data:/data
    networks:
      - logistics-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Minio init (create buckets) ───────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: logistics-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - logistics-net
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 logistics logistics123;
        mc mb --ignore-existing local/logistics;
        mc mb --ignore-existing local/logistics-dlq;
        mc mb --ignore-existing local/mlflow;
        echo 'Buckets ready';
      "
    restart: "no"

  # ── Spark Master ──────────────────────────────────────────────────────────
  spark-master:
    <<: *spark-common
    container_name: logistics-spark-master
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      HOME: /tmp/spark
      IVY_HOME: /tmp/.ivy2
      PYSPARK_PYTHON: python3
      PYTHONPATH: /opt/logistics
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8081
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-logistics}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-logistics123}
    ports:
      - "7077:7077"
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Spark Worker 1 ────────────────────────────────────────────────────────
  spark-worker-1:
    <<: *spark-common
    container_name: logistics-spark-worker-1
    hostname: spark-worker-1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      HOME: /tmp/spark
      IVY_HOME: /tmp/.ivy2
      PYSPARK_PYTHON: python3
      PYTHONPATH: /opt/logistics
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 3g
      SPARK_WORKER_WEBUI_PORT: 8082
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-logistics}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-logistics123}
    ports:
      - "8082:8082"
    depends_on:
      spark-master:
        condition: service_healthy

  # ── Spark Worker 2 ────────────────────────────────────────────────────────
  spark-worker-2:
    <<: *spark-common
    container_name: logistics-spark-worker-2
    hostname: spark-worker-2
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      HOME: /tmp/spark
      IVY_HOME: /tmp/.ivy2
      PYSPARK_PYTHON: python3
      PYTHONPATH: /opt/logistics
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 3g
      SPARK_WORKER_WEBUI_PORT: 8086
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-logistics}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-logistics123}
    ports:
      - "8086:8086"
    depends_on:
      spark-master:
        condition: service_healthy

  # ── Airflow Postgres (metadata DB) ────────────────────────────────────────
  airflow-postgres:
    image: postgres:16-alpine
    container_name: logistics-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    networks:
      - logistics-net
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Airflow Init ──────────────────────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: logistics-airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    command: >-
      bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname Umar --lastname Ahmad --role Admin --email umarahmad32191@gmail.com || true"
    restart: "no"

  # ── Airflow Scheduler ─────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: logistics-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Airflow Webserver ─────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: logistics-airflow-web
    command: webserver
    ports:
      - "8888:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  # ── MLflow ────────────────────────────────────────────────────────────────
  mlflow:
    build:
      context: ./mlflow
    container_name: logistics-mlflow
    command: >
      mlflow server
      --backend-store-uri postgresql://logistics:logistics123@postgres-operational:5432/logistics_ops
      --default-artifact-root s3://mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-logistics}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-logistics123}
    ports:
      - "5000:5000"
    depends_on:
      postgres-operational:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - logistics-net
    restart: unless-stopped

  # ── FastAPI ML Inference Server ───────────────────────────────────────────
  ml-server:
    build:
      context: ../src/ml
      dockerfile: Dockerfile
    container_name: logistics-ml-server
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-logistics}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-logistics123}
      DELTA_GOLD_PATH: s3a://logistics/delta/gold
    depends_on:
      - mlflow
      - minio
    networks:
      - logistics-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: logistics-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - logistics-net
    restart: unless-stopped

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: logistics-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - logistics-net
    restart: unless-stopped

networks:
  logistics-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  postgres-op-data:
  airflow-postgres-data:
  minio-data:
  spark-data:
  airflow-logs:
  grafana-data:
